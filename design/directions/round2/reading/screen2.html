<!doctype html>
<!-- OpenText look-lock round 1 — b-native-quiet — Quick create. Static mock. Dark: ?mode=dark. All colors are CSS variables. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenText — B Native quiet — Quick create</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --canvas:#e8eaec; --surface:#fafbfb; --ink:#1c2126; --muted:#63676b; --line:#c9ccce;
          --primary:#98b0cc; --on-primary:#141414; --accent:#cacd7e; --on-accent:#141414;
          --pri-press:#7d90a7; --sec-tint:#e7e6e8; --kit-divider:#e4e5e6; --kit-primary-3:#4f5358;
          --ab-muted:#63676b; --tile-line:rgba(28,33,38,0.08); --kit-checkbox:#707477;
          --shade:color-mix(in srgb, var(--ink) 15%, transparent);
          --glow:color-mix(in srgb, var(--surface) 95%, transparent);
          --scrim:color-mix(in srgb, var(--on-primary) 42%, transparent);
          --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
          --font-heading:"Inter Tight", system-ui, sans-serif; --font-body:"Inter", system-ui, sans-serif;
          --shadow-raised:-2px -2px 5px var(--glow), 3px 4px 10px var(--shade);
          --shadow-recessed:inset 2px 2px 5px var(--shade), inset -2px -2px 5px var(--glow);
          --shadow-float:0 0 0 1px var(--tile-line), 6px 14px 36px var(--shade); }
  :root.dark { --canvas:#252a2e; --surface:#33383c; --ink:#f5f7f9; --muted:#a2a5a8; --line:#44494c;
          --primary:#98b0cc; --on-primary:#141414; --accent:#cacd7e; --on-accent:#141414;
          --pri-press:#7d90a7; --sec-tint:#434548; --kit-divider:#464b4f; --kit-primary-3:#e3e5e8;
          --ab-muted:#dcdee1; --tile-line:rgba(245,247,249,0.1); --kit-checkbox:#abaeb1;
          --shade:color-mix(in srgb, var(--on-primary) 60%, transparent);
          --glow:color-mix(in srgb, var(--ink) 7%, transparent); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--canvas); color:var(--ink); font:400 13px/1.45 var(--font-body);
              -webkit-font-smoothing:antialiased; overflow:hidden; }
  button { font:inherit; color:inherit; border:0; margin:0; cursor:default; }
  .h { font-family:var(--font-heading); font-weight:600; letter-spacing:-0.04em; }
  .lights { display:flex; gap:8px; }
  .lights i { width:12px; height:12px; border-radius:50%; background:color-mix(in srgb, var(--ink) 20%, transparent); }
  .lab { font:600 12px/1 var(--font-body); letter-spacing:-0.01em; color:var(--ab-muted); }
  .btn-primary { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:28px; padding:0 8px 0 16px;
                 border-radius:10px; background:var(--primary); color:var(--on-primary); font:600 13px var(--font-body); letter-spacing:-0.01em; }
  .btn-primary svg { width:18px; height:18px; flex:none; }
  .btn-primary:active { background:var(--pri-press); }
  .chip { display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 6px 0 9px; border-radius:9px;
          background:var(--canvas); box-shadow:var(--shadow-raised); font:600 12px var(--font-body); letter-spacing:-0.01em; color:var(--ink); }
  .chip svg { width:12px; height:12px; }
  .btn-sec { display:inline-flex; align-items:center; height:28px; padding:0 12px; border-radius:10px; background:var(--canvas);
             box-shadow:var(--shadow-raised); font:600 13px var(--font-body); letter-spacing:-0.01em; color:var(--ink); }
  .th { display:flex; flex-direction:column; align-items:center; gap:4px; font:600 11px/1 var(--font-body); color:var(--ab-muted); }
  .th-pg { width:100%; height:72px; border-radius:6px; background:var(--surface); padding:9px 8px; display:flex; flex-direction:column; gap:5px; box-shadow:0 0 0 1px var(--tile-line); }
  .th-pg u { display:block; height:3px; border-radius:2px; background:var(--line); }
  .th-pg u:nth-child(1) { width:55%; } .th-pg u:nth-child(4) { width:70%; }
  .th.sel { color:var(--ink); } .th.sel .th-pg { box-shadow:0 0 0 2px var(--ink); }
  .doc { font-size:13px; line-height:1.55; color:var(--ink); }
  .doc .dh { display:flex; justify-content:space-between; color:var(--muted); font-size:0.82em; padding-bottom:0.7em; margin-bottom:1.4em; border-bottom:1px solid var(--line); }
  .doc h2 { font:600 1.65em/1.2 var(--font-heading); letter-spacing:-0.03em; margin:0 0 0.7em; }
  .doc p { margin:0 0 0.85em; }
  .doc b { font-weight:600; }
  .doc mark { background:var(--accent); color:var(--on-accent); padding:0.05em 0.15em; border-radius:3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .doc .df { color:var(--muted); font-size:0.82em; margin-top:1.4em; padding-top:0.7em; border-top:1px solid var(--line); }
  .status { font:500 12px var(--font-body); color:var(--muted); }
  /* quick create */
  .scrim { position:fixed; inset:0; background:var(--scrim); }
  .menubar { position:fixed; top:0; left:0; right:0; height:28px; z-index:5; display:flex; align-items:center; justify-content:space-between;
             padding:0 14px; background:var(--surface); box-shadow:0 1px 0 var(--tile-line); font:500 13px var(--font-body); }
  .menubar .l, .menubar .r { display:flex; align-items:center; gap:18px; }
  .menubar .l b { font-weight:600; }
  .mb-item { position:relative; display:inline-flex; align-items:center; justify-content:center; width:28px; height:20px; border-radius:6px; }
  .mb-item svg { width:15px; height:15px; }
  .mb-item.on { background:var(--ink); color:var(--canvas); }
  .seg { display:flex; gap:6px; }
  .seg span { flex:1; display:flex; align-items:center; justify-content:center; height:28px; border-radius:8px; background:var(--canvas);
              font:600 13px var(--font-body); letter-spacing:-0.01em; }
  .seg span.on { background:var(--primary); color:var(--on-primary); }
  .field { display:flex; align-items:center; height:28px; padding:0 12px; border-radius:8px; background:var(--canvas); box-shadow:var(--shadow-recessed);
           font:600 14px var(--font-body); letter-spacing:-0.02em; }
  .link { color:var(--ink); font-weight:600; text-decoration:underline; text-underline-offset:2px; }
  .hint { font:500 12px var(--font-body); color:var(--muted); }

  .pop { position:absolute; top:32px; right:-30px; width:420px; height:260px; padding:20px 22px 18px; border-radius:14px; background:var(--surface);
         box-shadow:var(--shadow-float); display:flex; flex-direction:column; justify-content:space-between; color:var(--ink); font-weight:400; }
  .pop:before { content:""; position:absolute; top:-6px; right:44px; width:12px; height:12px; background:var(--surface); transform:rotate(45deg); box-shadow:-1px -1px 0 var(--tile-line); }
  .row { display:flex; flex-direction:column; gap:6px; }
  .save { font:500 13px var(--font-body); } .save b { font-weight:600; }
  .foot { display:flex; align-items:center; justify-content:space-between; }

</style>
<script>if (location.search.includes("mode=dark")) document.documentElement.classList.add("dark");</script>
